<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiSarthi 🌱- Direct Voice-First Agri Ecosystem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .tab-active {
            border-bottom: 3.5px solid #059669;
            color: #047857;
            font-weight: 800;
            background: linear-gradient(to top, #ecfdf5 0%, transparent 100%);
        }

        .chat-scroll::-webkit-scrollbar, .scrollbar-hide::-webkit-scrollbar { display: none; }
        .chat-scroll, .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-header {
            background: rgba(4, 120, 87, 0.96);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen relative selection:bg-emerald-200">

    <!-- ================= AUTH & OTP SCREEN ================= -->
    <div id="auth-screen" class="fixed inset-0 bg-[url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center z-50 flex items-center justify-center transition-all duration-500">
        <div class="absolute inset-0 bg-emerald-950/80 backdrop-blur-md"></div>
